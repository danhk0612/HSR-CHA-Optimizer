name: Build Windows Portable EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-windows.yml'

jobs:
  windows-portable:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Electron build dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests, portable build and real Electron GUI smoke test
        run: npm run verify:win
      - name: Attach standalone executable
        uses: actions/upload-artifact@v4
        with:
          name: HSR-CHA-Optimizer-Windows-Portable
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
